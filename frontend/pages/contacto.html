<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectarium - Contacto</title>
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="stylesheet" href="/frontend/css/contacto.css">
</head>

<body>
    <div id="header"></div>
    <main class="contacto-main">
        <section class="contacto-contenedor">
            <div class="contacto-texto">
                <h1>Contacta con nosotros</h1>
                <p class="contacto-subtitulo">Estamos aquí para ayudarte. Rellena el formulario y nos pondremos en
                    contacto contigo lo antes posible.</p>
            </div>

            <form class="contacto-formulario" id="contacto-formulario">
                <div class="form-grupo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-grupo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-grupo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5"
                        placeholder="¿Tienes algún problema con alguno de los libros? ¿Quieres dejar una sugerencia de libros a añadir? ¡Te escuchamos!"
                        required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </section>
    </main>
    <div id="footer"></div>

    <script src="/frontend/js/config.js"></script>
    <script src="/frontend/js/componentes.js"></script>
    <script src="/frontend/js/contacto.js"></script>
</body>

</html>
